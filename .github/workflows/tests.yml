name: tests

# Runs both pipelines' regression suites on Linux AND macOS.
#
# Testing both is the point, not thoroughness for its own sake. This project is
# developed on macOS (BSD userland) and run on a Linux HPC, and almost every
# environment bug it has hit came from that gap: BSD vs GNU awk, `shasum` vs
# `sha256sum`, `wc -l` padding its output on BSD, `sed -i` semantics, rsync 2.6.9
# lacking flags that rsync 3.x has. A single-platform CI would have caught none
# of them.
#
# The suites use synthetic fixtures only — no patient data is involved, and
# nothing here needs secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap and dependency-free: catches an unbalanced quote or `fi` before
      # anyone waits on tool installation.
      - name: Parse every shell script
        run: |
          fail=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "  OK    $f"
            else
              echo "  FAIL  $f"
              fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' | sort)
          exit "$fail"

      # macOS ships bash 3.2 as /bin/bash, so bash-4-only syntax breaks for Mac
      # users — and breaks QUIETLY. `declare -A` on 3.2 is not an error: the
      # subscripts are evaluated arithmetically instead, so [deletions] made bash
      # resolve `deletions` as a variable and abort under set -u, while numeric
      # keys like [01] silently resolved to 1 and appeared to work.
      #
      # A runner cannot easily provide bash 3.2, so grep for the constructs
      # instead. Cheap, and it fails the build with a specific explanation.
      - name: No bash-4-only syntax (macOS ships bash 3.2)
        run: |
          # shellcheck disable=SC2016
          patterns='declare -A|local -A|mapfile |readarray |\$\{[A-Za-z_][A-Za-z0-9_]*,,\}|\$\{[A-Za-z_][A-Za-z0-9_]*\^\^\}'
          hits=$(grep -rnE "${patterns}" --include='*.sh' . \
                 | grep -v '^\./\.git/' \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)
          if [ -n "${hits}" ]; then
            echo "Found bash 4+ only syntax:"
            echo "${hits}" | sed 's/^/  /'
            echo ""
            echo "Use a space-separated list plus a case function instead."
            echo "See CONTRIBUTING.md, 'Code conventions'."
            exit 1
          fi
          echo "  OK: no bash-4-only constructs found"

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # report both platforms, don't stop at the first
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bedtools tabix bcftools pigz

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bedtools htslib bcftools pigz

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # The methylation pipeline is deliberately base-R only and needs no
      # packages. The SV pipeline does need them: its test suite calls
      # 04_run_all.sh, which runs stages 05-07 in R.
      #
      # `repos` is deliberately NOT overridden here. setup-r with
      # use-public-rspm: true points at Posit Package Manager, which serves
      # precompiled Linux binaries; forcing repos to cloud.r-project.org would
      # make ggplot2 and its dependency tree compile from source and turn a
      # 30-second step into several minutes.
      - name: Install R packages required by the SV pipeline
        run: |
          Rscript -e 'install.packages(c("yaml", "ggplot2", "scales"))'
          Rscript -e '
            need <- c("yaml", "ggplot2", "scales")
            missing <- need[!vapply(need, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("failed to install: ", paste(missing, collapse = ", "))
            cat("R packages present:", paste(need, collapse = ", "), "\n")'

      - name: Record versions
        run: |
          for t in bash awk sort bedtools tabix bgzip bcftools Rscript gzip; do
            printf '%-10s ' "$t"
            command -v "$t" >/dev/null 2>&1 \
              && ("$t" --version 2>&1 | head -1) \
              || echo "MISSING"
          done
          echo "R sanity: $(Rscript -e 'cat(2+2)')  (must be 4)"

      - name: Methylation pipeline tests
        run: bash pipelines/methylation/tests/run_tests.sh

      # Run from inside the pipeline directory. The SV test reference config
      # (tests/fixtures/test_reference_paths.yaml) uses paths RELATIVE to the
      # pipeline root, and 01_validate_inputs.sh checks them with a bare
      # `[[ -f "$f" ]]`, which resolves against the current working directory.
      # Invoked from the repository root those files are not found and every
      # reference check reports [MISS]. The methylation suite is unaffected: it
      # generates its reference config with absolute paths at run time.
      - name: SV pipeline tests
        working-directory: pipelines/sv
        run: bash tests/run_tests.sh

      # The fixtures are gzipped with -n so they carry no timestamp and are
      # byte-reproducible. If that ever regresses, every test run starts dirtying
      # the working tree again, which hides real changes. Assert it here rather
      # than rediscovering it in a confusing `git status`.
      - name: Fixtures must be byte-reproducible
        run: |
          bash pipelines/methylation/tests/make_fixtures.sh >/dev/null
          if git diff --quiet -- pipelines/methylation/tests/fixtures/; then
            echo "  OK: regenerating the fixtures produced identical bytes"
          else
            echo "  FAIL: fixtures changed when regenerated —"
            echo "  make_fixtures.sh must gzip with -n so no timestamp is embedded."
            git diff --stat -- pipelines/methylation/tests/fixtures/
            exit 1
          fi

      # The suites write to mktemp directories outside the repo and assert as
      # much themselves. This is the independent check: a clean tree after a full
      # test run, on a fresh checkout that has never seen real data.
      - name: Repository must be clean after testing
        run: |
          if git status --porcelain | grep -q .; then
            echo "  FAIL: the test run modified the working tree:"
            git status --short
            exit 1
          fi
          echo "  OK: working tree clean"
