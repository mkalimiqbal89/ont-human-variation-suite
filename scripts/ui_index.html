<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONT Human Variation Suite — Global Control Center</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }
    header h1 { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    header p { font-size: 0.9rem; color: var(--text-muted); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .pipeline-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      margin-bottom: 16px;
    }
    .pipeline-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--panel-border);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      user-select: none;
      transition: all 0.2s;
    }
    .pipeline-checkbox input { width: auto; cursor: pointer; }
    .pipeline-checkbox:hover { border-color: var(--accent); }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-success { background: var(--success); color: #0f172a; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    .peek-box {
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.8rem;
      color: #a7f3d0;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-top: 10px;
      display: none;
    }

    .console-card {
      grid-column: span 2;
    }
    #console {
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      height: 280px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .console-card { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>ONT Human Variation Suite</h1>
      <p>Unified Run & Pipeline Control Dashboard</p>
    </div>
    <div id="connection-status" style="font-size: 0.85rem; color: var(--success);">● Server Connected</div>
  </header>

  <div class="grid">
    <!-- Card 1: Sample, Run Naming & Global Paths -->
    <div class="card">
      <h2>📁 1. Global Sample & Path Settings</h2>
      
      <div class="form-group">
        <label>Analysis Run Name / Description</label>
        <input type="text" id="run_name" value="PromethION WGS Downstream Analysis">
      </div>

      <div class="form-group">
        <label>Sample ID (Anonymized)</label>
        <input type="text" id="sample_id" value="SAMPLE_01">
      </div>

      <div class="form-group">
        <label>Raw Sample Prefix (Epi2ME File Prefix)</label>
        <input type="text" id="raw_sample_prefix" value="sample_01">
      </div>

      <div class="form-group">
        <label>Input Directory (Epi2ME Outputs)</label>
        <input type="text" id="input_dir" placeholder="/path/to/epi2me/output">
      </div>

      <div class="form-group">
        <label>Shared Output Directory (Results)</label>
        <input type="text" id="output_dir" placeholder="/path/to/shared/results">
      </div>

      <div class="form-group">
        <label>Work Directory (Scratch Files)</label>
        <input type="text" id="work_dir" placeholder="/path/to/scratch/work">
      </div>

      <div class="form-group">
        <label>Institutional Archive Destination Root</label>
        <input type="text" id="archive_root" placeholder="/path/to/internal/archive">
      </div>
    </div>

    <!-- Card 2: Pipelines Selector & References -->
    <div class="card">
      <h2>🧬 2. Select Pipelines & References</h2>

      <div class="form-group">
        <label>Select Pipelines to Run (Single or Full Suite)</label>
        <div style="margin-bottom: 8px;">
          <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="selectAllPipelines(true)">Select All (Full Suite)</button>
          <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="selectAllPipelines(false)">Clear</button>
        </div>
        <div class="pipeline-selector">
          <label class="pipeline-checkbox">
            <input type="checkbox" id="pipe_sv" value="sv" checked> Structural Variants (SV)
          </label>
          <label class="pipeline-checkbox">
            <input type="checkbox" id="pipe_methylation" value="methylation" checked> CpG Methylation
          </label>
          <label class="pipeline-checkbox">
            <input type="checkbox" id="pipe_cnv" value="cnv" checked> Copy Number (CNV)
          </label>
          <label class="pipeline-checkbox">
            <input type="checkbox" id="pipe_snv" value="snv" checked> Small Variants (SNV/Indel)
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>GENCODE Gene BED Annotation File</label>
        <input type="text" id="gene_bed" placeholder="/path/to/gencode.genes.bed">
      </div>

      <div class="form-group">
        <label>Min Quality (QUAL Threshold)</label>
        <input type="number" id="min_qual" value="20">
      </div>

      <div class="form-group">
        <label>Min VAF (Variant Allele Frequency)</label>
        <input type="number" step="0.05" id="min_vaf" value="0.15">
      </div>

      <div class="form-group">
        <label>Min Depth / Support</label>
        <input type="number" id="min_dp" value="10">
      </div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="peekDirectory()">Validate Paths & Sneak Peek</button>
        <button class="btn btn-primary" onclick="saveGlobalConfig()">Save Global Config</button>
      </div>

      <div id="peek_box" class="peek-box"></div>
    </div>

    <!-- Card 3: Execution Control & Live Console -->
    <div class="card console-card">
      <h2>🖥️ 3. Execution Console</h2>
      <div class="actions" style="margin-bottom: 12px;">
        <button class="btn btn-secondary" onclick="checkDependencies()">Check Dependencies</button>
        <button class="btn btn-success" onclick="runSuite()">Run Selected Pipelines</button>
      </div>
      <div id="console">Set paths once above, then click "Save Global Config" or "Run Selected Pipelines"...</div>
    </div>
  </div>

  <script>
    function log(msg) {
      const el = document.getElementById('console');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    }

    function clearLog() {
      document.getElementById('console').textContent = '';
    }

    function getSelectedPipelines() {
      const selected = [];
      ['sv', 'methylation', 'cnv', 'snv'].forEach(p => {
        if (document.getElementById(`pipe_${p}`).checked) selected.push(p);
      });
      return selected;
    }

    function selectAllPipelines(val) {
      ['sv', 'methylation', 'cnv', 'snv'].forEach(p => {
        document.getElementById(`pipe_${p}`).checked = val;
      });
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        if (data.ok && data.config) {
          if (data.config.sample_id) document.getElementById('sample_id').value = data.config.sample_id;
          if (data.config.raw_sample_prefix) document.getElementById('raw_sample_prefix').value = data.config.raw_sample_prefix;
          if (data.config.run_description) document.getElementById('run_name').value = data.config.run_description;
          if (data.config.input_dir) document.getElementById('input_dir').value = data.config.input_dir;
          if (data.config.output_dir) document.getElementById('output_dir').value = data.config.output_dir;
          if (data.config.work_dir) document.getElementById('work_dir').value = data.config.work_dir;
          if (data.config.gene_bed) document.getElementById('gene_bed').value = data.config.gene_bed;
          if (data.config.archive_root) document.getElementById('archive_root').value = data.config.archive_root;
          log('Global suite configuration loaded.');
        }
      } catch (err) {
        log(`Notice: No previous config found. Default settings loaded.`);
      }
    }

    async function saveGlobalConfig() {
      const selected = getSelectedPipelines();
      if (selected.length === 0) {
        log('[WARNING] Please select at least one pipeline!');
        return;
      }

      const payload = {
        pipelines: selected,
        run_name: document.getElementById('run_name').value,
        sample_id: document.getElementById('sample_id').value,
        raw_sample_prefix: document.getElementById('raw_sample_prefix').value,
        input_dir: document.getElementById('input_dir').value,
        output_dir: document.getElementById('output_dir').value,
        work_dir: document.getElementById('work_dir').value,
        gene_bed: document.getElementById('gene_bed').value,
        archive_root: document.getElementById('archive_root').value,
        min_qual: document.getElementById('min_qual').value,
        min_vaf: document.getElementById('min_vaf').value,
        min_dp: document.getElementById('min_dp').value,
        pass_only: 'true'
      };

      try {
        const res = await fetch('/api/save-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          log(`[SUCCESS] Configuration saved for: ${data.saved_pipelines.join(', ')}`);
        } else {
          log(`[ERROR] Save failed: ${data.error}`);
        }
      } catch (err) {
        log(`[ERROR] ${err.message}`);
      }
    }

    async function peekDirectory() {
      const peekBox = document.getElementById('peek_box');
      peekBox.style.display = 'block';
      peekBox.textContent = 'Inspecting input directory (ls -lh) and reference paths...';

      const payload = {
        input_dir: document.getElementById('input_dir').value,
        gene_bed: document.getElementById('gene_bed').value,
        output_dir: document.getElementById('output_dir').value
      };

      try {
        const res = await fetch('/api/peek-path', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        let out = '';
        if (data.peek.input_dir) {
          if (data.peek.input_dir.exists) {
            out += `✓ Input Directory exists: ${payload.input_dir}\n`;
            if (data.peek.input_dir.matching_files && data.peek.input_dir.matching_files.length > 0) {
              out += `Found ${data.peek.input_dir.matching_files.length} Epi2ME input callsets:\n`;
              data.peek.input_dir.matching_files.forEach(f => out += `   - ${f}\n`);
            } else {
              out += `⚠ Warning: No matching *.wf_*.vcf.gz or *.bedmethyl.gz files found in input directory yet.\n`;
            }
            out += `\n--- Directory Contents (ls -lh) ---\n${data.peek.input_dir.ls_output || '(empty)'}\n`;
          } else {
            out += `✗ Input Directory NOT FOUND: ${payload.input_dir}\n`;
          }
        }
        if (data.peek.gene_bed) {
          out += data.peek.gene_bed.exists ? `✓ Gene BED exists: ${payload.gene_bed}\n` : `✗ Gene BED NOT FOUND: ${payload.gene_bed}\n`;
        }
        peekBox.textContent = out;
      } catch (err) {
        peekBox.textContent = `Error inspecting paths: ${err.message}`;
      }
    }

    async function checkDependencies() {
      const selected = getSelectedPipelines();
      if (selected.length === 0) {
        log('[WARNING] Please select at least one pipeline!');
        return;
      }
      clearLog();
      log(`Checking dependencies for: ${selected.join(', ')}...`);
      try {
        const res = await fetch('/api/check-deps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pipelines: selected })
        });
        const data = await res.json();
        log(data.output);
      } catch (err) {
        log(`[ERROR] ${err.message}`);
      }
    }

    async function runSuite() {
      const selected = getSelectedPipelines();
      if (selected.length === 0) {
        log('[WARNING] Please select at least one pipeline to run!');
        return;
      }
      clearLog();
      log(`Saving config and executing pipeline suite for: ${selected.join(', ')}...`);
      await saveGlobalConfig();
      try {
        const res = await fetch('/api/run-suite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pipelines: selected })
        });
        const data = await res.json();
        log(data.output);
      } catch (err) {
        log(`[ERROR] ${err.message}`);
      }
    }

    loadConfig();
  </script>
</body>
</html>
